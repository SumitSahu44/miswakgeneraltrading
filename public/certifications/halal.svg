<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer double ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#171717" stroke-width="4"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#171717" stroke-width="1.5"/>
  
  <!-- Arabic Calligraphy "حلال" in high resolution vector paths -->
  <g transform="translate(0, -4)">
    <text x="100" y="102" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade New', 'Noto Naskh Arabic', serif" font-weight="bold" font-size="65" fill="#171717" text-anchor="middle">حلال</text>
  </g>
  
  <!-- Horizontal Separator Line -->
  <line x1="42" y1="116" x2="158" y2="116" stroke="#171717" stroke-width="1.5"/>
  
  <!-- English Label: Halal -->
  <text x="100" y="156" font-family="'Times New Roman', Times, serif" font-size="38" font-weight="normal" fill="#171717" text-anchor="middle" letter-spacing="1">Halal</text>
</svg>
