<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <path id="isoTopPath" d="M 28,100 A 72,72 0 0,1 172,100" />
    <path id="isoBottomPath" d="M 172,100 A 72,72 0 0,1 28,100" />
  </defs>
  <!-- Outer double ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#171717" stroke-width="4"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#171717" stroke-width="1.5"/>
  
  <!-- Top Arc Text: CERTIFIED -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#171717" letter-spacing="3">
    <textPath href="#isoTopPath" startOffset="50%" text-anchor="middle">CERTIFIED</textPath>
  </text>
  
  <!-- Center Dark Circle -->
  <circle cx="100" cy="100" r="54" fill="#171717"/>
  
  <!-- Decorative leaf/ornament arch in center circle top & bottom -->
  <path d="M 72 62 Q 100 50 128 62 Q 100 66 72 62 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M 72 138 Q 100 150 128 138 Q 100 134 72 138 Z" fill="#ffffff" opacity="0.8"/>
  
  <!-- Center Text: ISO 9001:2015 -->
  <text x="100" y="98" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ISO</text>
  <text x="100" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">9001:2015</text>
  
  <!-- Bottom Arc Text: COMPANY -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="#171717" letter-spacing="3">
    <textPath href="#isoBottomPath" startOffset="50%" text-anchor="middle">COMPANY</textPath>
  </text>
</svg>
