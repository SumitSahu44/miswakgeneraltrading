<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <path id="orgTopPath" d="M 30,100 A 70,70 0 0,1 170,100" />
    <path id="orgBottomPath" d="M 170,100 A 70,70 0 0,1 30,100" />
  </defs>
  <!-- Outer double ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#171717" stroke-width="4"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#171717" stroke-width="1.5"/>
  
  <!-- Top Arc Text: ENVIRONMENT FRIENDLY -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="10.5" fill="#171717" letter-spacing="1.5">
    <textPath href="#orgTopPath" startOffset="50%" text-anchor="middle">ENVIRONMENT FRIENDLY</textPath>
  </text>
  
  <!-- Leaf Vector Emblem in center top -->
  <g transform="translate(100, 64) scale(0.9)">
    <path d="M 0 -12 C -12 -12 -18 0 -12 12 C -6 8 2 4 14 3 C 10 -4 6 -10 0 -12 Z" fill="#171717"/>
    <path d="M -12 12 C -5 18 11 16 17 8 C 17 8 4 6 -12 12 Z" fill="#171717"/>
  </g>
  
  <!-- Center Text: 100% ORGANIC -->
  <text x="100" y="112" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" font-weight="900" fill="#171717" text-anchor="middle" letter-spacing="0.5">100%</text>
  <text x="100" y="138" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#171717" text-anchor="middle" letter-spacing="1.5">ORGANIC</text>
  
  <!-- Bottom Arc Text: RETURN TO NATURE -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="10.5" fill="#171717" letter-spacing="1.5">
    <textPath href="#orgBottomPath" startOffset="50%" text-anchor="middle">RETURN TO NATURE</textPath>
  </text>
</svg>
